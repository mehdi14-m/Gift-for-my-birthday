<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Squid Game Birthday</title>
  <link rel="icon" type="image/png" href="bir.png"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif;
      background: url('bck.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .floating-shapes {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      width: 30px;
      height: 30px;
      opacity: 0.2;
      animation: float 12s infinite linear;
    }

    .circle { border-radius: 50%; background: #ff0066; }
    .triangle { background: #00ff99; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    .square { background: #ffcc00; }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(1);
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
      }
    }

    .intro-text {
      font-size: 28px;
      color: #ff0066;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #fff;
      width: 0;
      animation: typing 4s steps(30, end) forwards, blink 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      50% { border-color: transparent }
    }

    #countdown {
      font-size: 20px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed #ff0066;
      border-radius: 10px;
      margin: 20px 0;
    }

    .celebrate {
      display: none;
      font-size: 24px;
      color: #00ff99;
      margin-top: 20px;
    }

    .gift-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .gift-list img {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      border: 2px solid #ff0066;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: #fff;
    }

    .gift-list img:hover {
      transform: scale(1.2);
      box-shadow: 0 0 20px #ff0066;
    }

    .glow-btn {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background: transparent;
      border: 2px solid #ff0066;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      animation: glow 2s infinite ease-in-out;
    }

    @keyframes glow {
      0%, 100% {
        box-shadow: 0 0 5px #ff0066;
      }
      50% {
        box-shadow: 0 0 15px #ff0066;
      }
    }

    @media (max-width: 600px) {
      .intro-text {
        font-size: 20px;
      }
      .gift-list img {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>

  <div class="floating-shapes">
    <!-- Random floating shapes -->
    <div class="shape circle" style="left:10%; animation-delay: 0s;"></div>
    <div class="shape triangle" style="left:30%; animation-delay: 2s;"></div>
    <div class="shape square" style="left:50%; animation-delay: 4s;"></div>
    <div class="shape circle" style="left:70%; animation-delay: 1s;"></div>
    <div class="shape triangle" style="left:85%; animation-delay: 3s;"></div>
  </div>

  <div class="container">
    <div class="intro-text">Squid Game Birthday Countdown</div>
    <div id="countdown"></div>
    <div class="celebrate">Game Over... It's Your Birthday, Cousin!</div>

    <div class="gift-list">
      <img src="img/gift1.jpg" alt="Gift 1">
      <img src="img/gift2.jpg" alt="Gift 2">
      <img src="img/gift3.jpg" alt="Gift 3">
      <img src="img/gift4.jpg" alt="Gift 4">
      <img src="img/gift5.jpg" alt="Gift 5">
    </div>

    <button class="glow-btn">Play Your Birthday Game</button>
  </div>

  <script>
    function updateCountdown() {
      const birthday = new Date("April 15, 2025 00:00:00").getTime();
      const now = new Date().getTime();
      const difference = birthday - now;

      if (difference <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.querySelector(".celebrate").style.display = "block";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML =
        `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s left ⏳`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
